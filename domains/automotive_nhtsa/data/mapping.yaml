# Mapping: NHTSA complaint CSV columns → canonical records fields.
# Executed by src.domains.mapping_ingest and scripts.ingest_nhtsa
# (not the 10-row fixture seed, not ingest_scale clones).

source: NHTSA complaints CSV
records:
  record_id: CMPLID
  received_at: DATEA
  occurred_at: DATEC
  entity_1: MODEL_YR
  entity_2: MAKETXT
  entity_3: MODELTXT
  # COMPONENT is COMPDESC normalized onto gazetteers/categories.csv by
  # scripts.ingest_nhtsa. It must stay a closed vocabulary: the advisory
  # join, the anomaly baselines, the cluster signatures and the severity
  # rules all match category by exact string equality, so a free-text
  # value here does not error — it silently matches nothing.
  category: COMPONENT
  # Full raw NHTSA hierarchy, e.g.
  # "SERVICE BRAKES, HYDRAULIC:FOUNDATION COMPONENTS:DISC:ROTOR". Kept for
  # investigators; no consumer groups on it.
  subcategory: COMPDESC
  text: CDESC
  severity_label: NUM_CYLS  # placeholder; NHTSA has no severity label
  region: STATE
  source: "NHTSA"
  entity_key: "{MODEL_YR}|{MAKETXT}|{MODELTXT}"

advisories:
  advisory_id: CAMPNO
  issued_at: MFR_DATE
  scope_entity_1: MODEL_YR
  scope_entity_2: MAKETXT
  scope_entity_3: MODELTXT
  scope_category: COMPNAME
  summary: SUBJECT
  remedy: SUMMARY
  url: RCL_URL
  source: "NHTSA"
