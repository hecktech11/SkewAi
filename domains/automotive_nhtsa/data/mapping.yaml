# Mapping: NHTSA complaint CSV columns → canonical records fields.
# Executed by src.domains.mapping_ingest and scripts.ingest_nhtsa
# (not the 10-row fixture seed, not ingest_scale clones).

source: NHTSA complaints CSV
records:
  # Composite: ODINO|MODEL_YR|MAKETXT|MODELTXT|COMPONENT, built by
  # scripts.ingest_nhtsa.record_key so the dedup key and the record id
  # cannot drift apart. CMPLID — the old key — is unique per FLAT line, and
  # NHTSA emits one line per component, so a complaint naming several
  # components became several records and was counted up to 17 times.
  record_id: RECORD_KEY
  received_at: DATEA
  occurred_at: DATEC
  entity_1: MODEL_YR
  entity_2: MAKETXT
  entity_3: MODELTXT
  # COMPONENT is COMPDESC normalized onto gazetteers/categories.csv by
  # scripts.ingest_nhtsa. It must stay a closed vocabulary: the advisory
  # join, the anomaly baselines, the cluster signatures and the severity
  # rules all match category by exact string equality, so a free-text
  # value here does not error — it silently matches nothing.
  category: COMPONENT
  # Full raw NHTSA hierarchy, e.g.
  # "SERVICE BRAKES, HYDRAULIC:FOUNDATION COMPONENTS:DISC:ROTOR". Kept for
  # investigators; no consumer groups on it.
  subcategory: COMPDESC
  text: CDESC
  severity_label: NUM_CYLS  # placeholder; NHTSA has no severity label
  region: STATE
  source: "NHTSA"
  entity_key: "{MODEL_YR}|{MAKETXT}|{MODELTXT}"

# FLAT_RCL (published RCL.txt field list, May 2025 update). One campaign
# covers many models, so advisory_id is
# CAMPNO|YEARTXT|MAKETXT|MODELTXT|COMPONENT, built by scripts.ingest_recalls.
# issued_at is RCDATE, the Part 573 report-received date. ODATE is owner
# notification and DATEA is the file-add date; neither is the receipt clock.
# COMPONENT is COMPNAME normalized with the same function as complaints.
advisories:
  advisory_id: ADVISORY_KEY
  issued_at: RCDATE
  scope_entity_1: YEARTXT
  scope_entity_2: MAKETXT
  scope_entity_3: MODELTXT
  scope_category: COMPONENT
  summary: DESC_DEFECT
  remedy: CORRECTIVE_ACTION
  url: RCL_URL
  source: "NHTSA"
