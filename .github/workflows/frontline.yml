# Frontline v2 — unit suite + offline dual-pack eval + dashboard build
# Local mirror: `make ci`  (requires .venv or system deps from requirements.txt)

name: frontline

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PY: python
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test-and-eval:
    name: seed · lint · pytest · eval
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements-lock.txt

      - name: Bytecode compile (import-time syntax gate)
        run: python -m compileall -q src scripts eval

      - name: Build fixture warehouses
        run: make frontline-db

      - name: Pack lint (real verticals)
        run: |
          make pack-lint PACK=automotive_nhtsa
          make pack-lint PACK=finance_cfpb

      - name: Set up Node (pytest builds dashboard dist)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard deps
        working-directory: dashboard
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Unit + contract tests
        # Fail hangs instead of burning the runner (WS contract must not block CI).
        run: make test

      - name: SLM Phase 0 probes (honest-baseline regression suite)
        run: make slm-probes

      - name: Offline dual-pack eval
        run: make eval-frontline

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontline-eval-report
          path: reports/qubot/eval/
          if-no-files-found: warn
          retention-days: 14

  dashboard:
    name: dashboard production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install + build
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          test -f dist/index.html

  docker-smoke:
    name: docker build, startup and customer turn smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required build context paths
        run: |
          set -euo pipefail
          for p in \
            Dockerfile \
            docker-compose.yml \
            docker/entrypoint.sh \
            requirements-docker.txt \
            requirements.txt \
            Makefile \
            dashboard/package.json \
            domains/automotive_nhtsa/pack.yaml \
            domains/finance_cfpb/pack.yaml \
            scripts/seed_frontline_fixtures.py \
            src/api/main.py
          do
            test -e "$p" || { echo "MISSING: $p"; exit 1; }
          done
          test -x docker/entrypoint.sh || chmod +x docker/entrypoint.sh
          # Compose health + Dockerfile HEALTHCHECK must not depend on curl
          grep -q "urllib.request" docker-compose.yml
          grep -q "HEALTHCHECK" Dockerfile
          grep -q "requirements-docker.txt" Dockerfile
          echo "docker static checks OK"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t skewai-frontline:test .

      - name: Start container and verify customer turn
        run: |
          docker run -d --name frontline-test \
            -p 8000:8000 \
            -e FRONTLINE_OPEN_BIND_ACK=1 \
            -e FRONTLINE_ENABLED=1 \
            -e DOMAIN_PACK=automotive_nhtsa \
            skewai-frontline:test

          echo "Waiting for container health readiness..."
          HEALTHY=0
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "Container is healthy after ${i} attempts!"
              HEALTHY=1
              break
            fi
            sleep 2
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "Container failed to become healthy. Showing logs:"
            docker logs frontline-test
            exit 1
          fi

          echo "Starting customer interaction..."
          START_RESP=$(curl -sf -X POST "http://127.0.0.1:8000/api/interactions/start?channel=web_text&pack_id=automotive_nhtsa")
          echo "Interaction started: $START_RESP"

          IID=$(python3 -c "import json; d=json.loads('''$START_RESP'''); print(d.get('interaction_id') or '')")
          TOKEN=$(python3 -c "import json; d=json.loads('''$START_RESP'''); print(d.get('capability_token') or '')")
          if [ -z "$IID" ]; then
            echo "Failed to extract interaction_id"
            docker logs frontline-test
            exit 1
          fi

          echo "Sending customer turn via WebSocket for interaction $IID..."
          docker exec frontline-test python3 -c "
import asyncio, json, websockets

async def test_ws():
    url = 'ws://127.0.0.1:8000/ws/interaction/$IID?token=$TOKEN'
    async with websockets.connect(url) as ws:
        await ws.send(json.dumps({'type': 'user_turn', 'text': 'my brake pedal feels spongy'}))
        for _ in range(10):
            raw = await asyncio.wait_for(ws.recv(), timeout=15.0)
            msg = json.loads(raw)
            print('WS received:', msg.get('type'), msg.get('text'))
            if msg.get('type') in ('agent_turn', 'turn') and (msg.get('speaker') == 'agent' or msg.get('text')):
                print('Agent turn verified!')
                return
    raise RuntimeError('No agent turn received')

asyncio.run(test_ws())
"
          if [ $? -ne 0 ]; then
            echo "WebSocket test failed. Container logs:"
            docker logs frontline-test
            exit 1
          fi

          docker stop frontline-test
          docker rm frontline-test
          echo "Docker startup and customer turn smoke test passed!"
